@if(isOpen()) {
  <!-- Overlay -->
  <div
    (click)="close()"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  >
    <!-- Modal -->
    <div
      (click)="$event.stopPropagation()"
      class="bg-white rounded-lg shadow-lg w-full max-w-lg max-h-[90vh] p-6 relative overflow-y-auto"
    >
      <!-- Botão de fechar -->
      <button
        (click)="close()"
        class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 text-xl"
      >
        &times;
      </button>

      <!-- Conteúdo dinâmico -->
      <ng-content></ng-content>
    </div>
  </div>
}
