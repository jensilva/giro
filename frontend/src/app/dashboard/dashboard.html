<div class="flex h-screen">
  <nav class="w-64 bg-white text-gray-900 flex flex-col shadow">
    <h1 class="text-2xl font-bold p-4">Dashboard</h1>
    <ul class="border-b-gray-200 px-4 pb-4 border-b-1">
      @for (menuItem of menuItems; track menuItem.name) {
        <li>
          <a
            [routerLink]="menuItem.to ? ['/dashboard', menuItem.to] : ['/dashboard']"
            routerLinkActive="bg-blue-500 text-white hover:bg-blue-500"
            [routerLinkActiveOptions]="{ exact: !menuItem.to }"
            class="block text-gray-900 py-2 px-4 rounded hover:bg-blue-50"
          >
            {{ menuItem.name }}
          </a>
        </li>
      }
    </ul>

    <div class="mt-auto py-2 px-4 flex flex-col border-t border-gray-200">
      <button
        (click)="logout()"
        class="text-left cursor-pointer px-4 py-2 text-gray-900  rounded hover:bg-blue-50"
      >Sair</button>
      <p class="text-xs mt-2 text-gray-700">Logado: {{ userName }}</p>
    </div>

  </nav>

  <div class="flex-1 p-6">
    <router-outlet></router-outlet>
  </div>
</div>
