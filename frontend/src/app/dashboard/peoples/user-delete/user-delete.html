<div class="p-6 text-center">
  <h2 class="text-xl font-semibold mb-4 text-red-600">Tem certeza que deseja deletar este user?</h2>
  <p class="mb-6 text-gray-700">Esta ação não poderá ser desfeita.</p>
  <div class="flex justify-center gap-4">
    <button
      class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition"
      (click)="confirmDelete()"
    >
      Deletar
    </button>
    <button
      class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 transition"
      (click)="cancelDelete()"
    >
      Cancelar
    </button>
  </div>
</div>
